spring.application.name=payment-ledger

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USERNAME:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework