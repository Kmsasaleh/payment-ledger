spring.application.name=payment-ledger

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USERNAME:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Fraud triage (Jev). The API key comes only from the AI_GATEWAY_API_KEY env var.
fraud.triage.min-confidence=0.80
fraud.triage.flag-threshold=0.5
fraud.triage.skip-system-sources=true
fraud.jev.base-url=https://ai-gateway.vercel.sh/typesafe
fraud.jev.model=typesafe-ai/jev
fraud.jev.api-key=${AI_GATEWAY_API_KEY:}
fraud.jev.connect-timeout=1s
fraud.jev.read-timeout=2s
fraud.jev.max-calls-per-day=500
